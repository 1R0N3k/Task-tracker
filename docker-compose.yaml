services:
  db:
    image: postgres:17
    container_name: task-tracker-db
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker 
      POSTGRES_DB: tracker
    ports:
      - 127.0.0.1:5432:5432 
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
